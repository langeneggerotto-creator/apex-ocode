name: OCODE Law Guardian v0.2

on:
  pull_request:
    paths:
      - 'law-guardian/**'
      - '.github/workflows/ocode-law-guardian-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: law-guardian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Law Guardian tests
        run: npm test
      - name: Generate canonical registry receipt and Evidence Ledger record
        run: npm run demo:registry
      - name: Verify receipt and record exist
        run: |
          test -s policy-receipt-v0.2.json
          test -s core-os-policy-evidence-v0.1.json
          node -e "const e=require('./core-os-policy-evidence-v0.1.json'); if(e.record_type!=='CORE_OS_POLICY_EVIDENCE') process.exit(1); if(e.inherited_law.sync_status!=='PINNED_SNAPSHOT') process.exit(1);"
      - name: Preserve verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocode-law-guardian-v0.2-evidence
          path: |
            law-guardian/policy-receipt-v0.2.json
            law-guardian/core-os-policy-evidence-v0.1.json
          if-no-files-found: error
          retention-days: 30
