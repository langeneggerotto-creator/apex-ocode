name: OCODE v0.6 Terminal Session Kernel

on:
  pull_request:
    paths:
      - 'terminal-session-v0.6/**'
      - '.github/workflows/ocode-terminal-session-v0.6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-terminal-session-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal-session-v0.6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify bounded terminal session kernel
        run: npm run verify

      - name: Verify truth boundary and stop condition
        shell: bash
        run: |
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('evidence/OCODE_v0.6_SCOPE_RECEIPT.json','utf8')); if(!r.excluded.includes('process spawning') || !r.excluded.includes('terminal UI')) process.exit(1);"
          grep -q 'NO_PROCESS_OR_PTY_EXECUTION' README.md
