[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocode-sandbox"
version = "0.1.0"
description = "OCode Bite 1 - Linux sandbox and explicit workspace trust (local mode)"
requires-python = ">=3.9"
dependencies = [
    "pyseccomp>=0.1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
