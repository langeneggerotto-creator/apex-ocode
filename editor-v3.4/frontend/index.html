<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCode Editor</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app">
    <div id="toolbar" role="toolbar" aria-label="Editor actions">
      <button id="btn-save" aria-label="Save current file (Ctrl+S)">Save</button>
      <button id="btn-find" aria-label="Find">Find</button>
      <button id="btn-replace" aria-label="Replace">Replace</button>
      <button id="btn-format" aria-label="Format document">Format</button>
      <button id="btn-diff" aria-label="Show diff against saved version">Diff</button>
      <button id="btn-split" aria-label="Toggle split pane">Split</button>
      <select id="pane-select" class="hidden" aria-label="Open files into pane">
        <option value="0">Open into: Pane 1</option>
        <option value="1">Open into: Pane 2</option>
      </select>
    </div>

    <nav id="tree" aria-label="File tree"></nav>

    <main id="editors">
      <div id="pane0" class="pane" aria-label="Editor pane 1">
        <div id="tabbar0" class="tabbar"></div>
        <div id="pane0-editor" class="editor-container"></div>
      </div>
      <div id="pane1" class="pane hidden" aria-label="Editor pane 2">
        <div id="tabbar1" class="tabbar"></div>
        <div id="pane1-editor" class="editor-container"></div>
      </div>
    </main>

    <div id="status" role="status" aria-live="polite">Loading…</div>
  </div>

  <div id="diff-overlay" class="hidden" role="dialog" aria-label="Diff against saved version">
    <div id="diff-panel">
      <div id="diff-header">
        <span>Diff: live edits vs. last saved</span>
        <button id="btn-diff-close" aria-label="Close diff view">Close</button>
      </div>
      <div id="diff-container"></div>
    </div>
  </div>

  <script src="vendor/monaco/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: "vendor/monaco/vs" } });
    require(["vs/editor/editor.main"], function () {
      import("./src/app.js").then((mod) => mod.init());
    });
  </script>
</body>
</html>
