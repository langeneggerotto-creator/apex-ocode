[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocode-terminal"
version = "0.1.0"
description = "OCode Bite 2 - persistent, sandboxed, reconnectable integrated terminal (local mode)"
requires-python = ">=3.9"
dependencies = [
    "ocode-sandbox>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
