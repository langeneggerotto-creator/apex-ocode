[project]
name = "dreammusicforge"
version = "0.1.0"
description = "DreamMusicForge Film Compiler -- provider-neutral AI music-video production pipeline, governed as an APEX OCode module. Release 0.1: Project Kernel only."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only providers.runway.RunwayClient needs this -- everything else in
# this repository (including providers.runway's own compiler/models/
# schema) stays dependency-free. Verified installable from PyPI in
# this environment (`pip install --dry-run runwayml` resolves real
# wheels); not verified against Runway's live API (no API key
# available -- see providers/runway/client.py's module docstring).
runway = ["runwayml>=5.0"]

[project.scripts]
dmf = "dreammusicforge.apps.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"dreammusicforge" = "."}

[tool.setuptools.packages.find]
where = ["."]

# Packaging metadata only -- `pip install` has not been executed against
# this file in this environment. The package has been exercised via
# `python -m unittest discover` and `python -m dreammusicforge.apps.cli.main`
# from the repository root, both of which work today without installation.
